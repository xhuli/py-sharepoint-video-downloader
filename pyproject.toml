[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "py-sharepoint-video-downloader"
version = "0.1.1"
description = "Helper to download Microsoft Teams and SharePoint recordings from videomanifest URLs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "yt-dlp[default,curl-cffi]>=2025.8.20",
]

[project.scripts]
sp-video-download = "download:main"

[tool.setuptools]
py-modules = ["download"]
